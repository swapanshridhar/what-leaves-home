# Publish the live demo (made-up devices, read-only, no server) to GitHub Pages on every push to main.
# Turn Pages on once: Settings → Pages → Source: GitHub Actions.
name: live demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python tools/build_demo.py --out site --repo "https://github.com/${{ github.repository }}"
      # The walkthrough video: its page and thumbnail are in docs/, the video itself is a release
      # file (kept out of the repository's history), fetched here so the page can play it.
      - run: |
          cp docs/walkthrough.html docs/walkthrough.png site/
          curl -fsSL -o site/walkthrough.mp4 "https://github.com/${{ github.repository }}/releases/download/v0.8.1/what-leaves-home-walkthrough.mp4"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
