<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Leaves Home</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e4e2dc;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --warn: #9a5b00; --warn-soft: #fff3e0; --chip: #efeeea;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #141416; --panel: #1d1d20; --ink: #ececef; --muted: #9a9aa2; --line: #2e2e33;
          --accent: #7c9cff; --accent-soft: #232a40; --warn: #f0b45a; --warn-soft: #3a2c16; --chip: #29292e; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
header { padding: 20px 24px 12px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
#status { color: var(--muted); font-size: 13px; }
#banner { margin: 0 24px 12px; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); font-size: 14px; }
#banner[hidden] { display: none; }
main { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; padding: 0 24px 32px; }
@media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 0 16px 24px; } header { padding: 16px; } #banner { margin: 0 16px 12px; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
#devices { list-style: none; margin: 0; padding: 6px; align-self: start; }
#devices li button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: 10px 12px;
                     border-radius: 8px; cursor: pointer; }
#devices li button:hover { background: var(--chip); }
#devices li button[aria-current="true"] { background: var(--accent-soft); }
#devices li button:focus-visible { outline: 2px solid var(--accent); }
.dname { font-weight: 600; }
.dmeta { color: var(--muted); font-size: 13px; }
#detail { padding: 18px 20px; min-width: 0; }
#detail h2 { margin: 0 0 2px; font-size: 19px; }
#detail h3 { margin: 22px 0 8px; font-size: 15px; }
.sub { color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.stat { background: var(--chip); border-radius: 8px; padding: 8px 12px; min-width: 110px; }
.stat b { display: block; font-size: 18px; }
.stat span { color: var(--muted); font-size: 12px; }
.flag { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 8px 12px; margin: 8px 0 0; font-size: 14px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--chip); color: var(--muted); margin-left: 6px; }
.tag.block { background: var(--warn-soft); color: var(--warn); }
.empty { color: var(--muted); padding: 24px; }
footer { color: var(--muted); font-size: 12px; padding: 0 24px 24px; }
</style>
</head>
<body>
<header>
  <h1>What Leaves Home</h1>
  <span id="status">Loading…</span>
</header>
<div id="banner" hidden></div>
<main>
  <ul id="devices" class="panel" aria-label="Devices"></ul>
  <section id="detail" class="panel" aria-live="polite"><p class="empty">Pick a device to see what it talks to.</p></section>
</main>
<footer>Read-only. Data stays on this machine. Times are in your browser's time zone.</footer>
<script src="/app.js"></script>
</body>
</html>
