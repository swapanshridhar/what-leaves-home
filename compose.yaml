# What Leaves Home on its own, for a home that already runs AdGuard Home or Pi-hole 6.
#
#   docker compose up -d
#
# Then open http://<this machine's address>:8080 and press Connect. Until it's connected it
# shows demo devices. Or put your AdGuard Home details in a .env file (see .env.example).
services:
  whatleaves:
    image: ghcr.io/swapanshridhar/what-leaves-home:latest
    build: .   # used only by `docker compose up --build`, from a clone of the repository
    container_name: whatleaves
    restart: unless-stopped
    ports:
      - "${WL_HOST_PORT:-8080}:8080"   # 8080 taken? Put WL_HOST_PORT=8090 in .env
    env_file:
      - path: .env
        required: false
    volumes:
      - whatleaves-data:/data

volumes:
  whatleaves-data:
