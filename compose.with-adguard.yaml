# Everything in one: AdGuard Home (your DNS filter) and What Leaves Home, already connected.
#
#   docker compose -f compose.with-adguard.yaml up -d
#
# Then:
#   1. right away, open http://<this machine>:3000 and finish AdGuard Home's short setup
#      (keep its web page on port 3000, and DNS on port 53). Until you do, anyone on your
#      network could set AdGuard's login first.
#   2. point your router's DNS at this machine (for Google Wifi / Nest Wifi: Google Home
#      app → Wi-Fi → Settings → Advanced networking → DNS → Custom)
#   3. open http://<this machine>:8080
#
# What Leaves Home reads AdGuard's query-log file directly, so it needs no AdGuard login.
services:
  adguard:
    image: adguard/adguardhome:v0.107.79
    container_name: adguardhome
    restart: unless-stopped
    # Host networking, so AdGuard sees each device's real address and answers DNS on port 53.
    network_mode: host
    volumes:
      - adguard-work:/opt/adguardhome/work
      - adguard-conf:/opt/adguardhome/conf

  whatleaves:
    image: ghcr.io/swapanshridhar/what-leaves-home:latest
    build: .   # used only by `docker compose up --build`, from a clone of the repository
    container_name: whatleaves
    restart: unless-stopped
    depends_on: [adguard]
    ports:
      - "${WL_HOST_PORT:-8080}:8080"   # 8080 taken? Put WL_HOST_PORT=8090 in .env
    env_file:
      - path: .env
        required: false
    environment:
      WL_ADGUARD_LOG: /adguard/data/querylog.json
      WL_ADGUARD_UI_PORT: "3000"
    # AdGuard keeps its log readable by root only, so this container runs as root, but with
    # every capability dropped, a read-only root filesystem and no privilege escalation.
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - adguard-work:/adguard:ro
      - whatleaves-data:/data

volumes:
  adguard-work:
  adguard-conf:
  whatleaves-data:
